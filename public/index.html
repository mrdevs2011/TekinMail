<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TekinMail</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-root">
    <!-- TOP HEADER -->
    <header class="top-nav">
      <div class="nav-brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="12" fill="#38BDF8"/>
          <path d="M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12ZM16 12V13.5C16 14.8807 17.1193 16 18.5 16V16C19.8807 16 21 14.8807 21 13.5V12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21H16" 
                stroke="#FFFFFF" 
                stroke-width="1.8" 
                stroke-linecap="round" 
                stroke-linejoin="round"/>
        </svg>
        <span class="nav-brand-title">TekinMail</span>
      </div>

      <!-- User Profile Badge -->
      <div id="userProfileBadge" class="user-profile-badge hidden">
        <div class="profile-text">
          <span id="badgeFullName" class="profile-name">Muhammadrasul Qosimov</span>
          <span id="badgeUsername" class="profile-handle">@bymrdev</span>
        </div>
        <button id="btnLogout" class="badge-logout-btn" title="Chiqish">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 1. AUTH SCREEN (KIRISH / RO'YXATDAN O'TISH) -->
    <main id="authScreen" class="auth-wrap">
      <div class="auth-box">
        <div class="auth-tabs">
          <button id="tabLogin" class="auth-tab active">kirish</button>
          <button id="tabRegister" class="auth-tab">ro'yxatdan o'tish</button>
        </div>

        <!-- LOGIN FORMA -->
        <form id="formLogin" class="auth-form-body">
          <div class="form-group">
            <label>username</label>
            <input type="text" id="loginUsername" placeholder="username..." autocomplete="username" required autofocus>
          </div>
          <div class="form-group">
            <label>parol</label>
            <input type="password" id="loginPassword" placeholder="parol..." autocomplete="current-password" required>
          </div>
          <button type="submit" id="btnLoginSubmit" class="btn-primary-auth">tizimga kirish</button>
        </form>

        <!-- REGISTER FORMA -->
        <form id="formRegister" class="auth-form-body hidden">
          <div class="form-group">
            <label>ism (to'liq ismingiz)</label>
            <input type="text" id="regFullName" placeholder="masalan: Muhammadrasul Qosimov" required>
          </div>
          <div class="form-group">
            <label>username</label>
            <input type="text" id="regUsername" placeholder="masalan: bymrdev" required>
          </div>
          <div class="form-group">
            <label>parol</label>
            <input type="password" id="regPassword" placeholder="kamida 4 ta belgi..." required>
          </div>
          <button type="submit" id="btnRegisterSubmit" class="btn-primary-auth">root akkaunt yaratish</button>
        </form>
      </div>
    </main>

    <!-- 2. MAIN WORKSPACE (ESKIZDAGI 2 USTUNLI PANEL) -->
    <main id="mainWorkspace" class="workspace-grid hidden">
      <!-- CHAP USTUN: EMAILS -->
      <section class="panel-column emails-col">
        <div class="column-title-bar">
          <h1 class="col-heading">Emails</h1>
          <button id="btnAddOne" class="btn-add-pill" title="Yangi email qo'shish">
            <span>ADD +1</span>
          </button>
        </div>

        <!-- Search Bar -->
        <div class="search-wrap">
          <input type="text" id="emailSearchInput" placeholder="search emails" autocomplete="off" spellcheck="false">
        </div>

        <!-- Emails Cards List -->
        <div class="email-cards-scroll" id="emailsListContainer">
          <!-- Dynamic cards injected by JS -->
        </div>
      </section>

      <!-- O'NG USTUN: INBOX -->
      <section class="panel-column inbox-col">
        <div class="column-title-bar">
          <h1 class="col-heading">Inbox</h1>
          <button id="btnRefreshInbox" class="btn-sync-icon" title="Yangilash">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
          </button>
        </div>

        <!-- Filter Tabs (Eskizdagi qizil filtr tablar) -->
        <div class="inbox-filter-tabs" id="inboxFilterTabs">
          <button class="filter-tab active" data-filter="all">Barchasi</button>
          <!-- Dynamic email tabs injected by JS -->
        </div>

        <!-- Messages List (Gmail / Supabase Style) -->
        <div class="inbox-messages-scroll" id="messagesListContainer">
          <!-- Dynamic messages rows injected by JS -->
        </div>
      </section>
    </main>

    <!-- ADD EMAIL CUSTOM MODAL / PROMPT -->
    <div id="addEmailModal" class="modal-layer hidden">
      <div class="modal-backdrop-click" id="addEmailBackdrop"></div>
      <div class="modal-card">
        <h3>Yangi Email Qo'shish</h3>
        <p class="modal-sub">Ixtiyoriy prefiks kiriting yoki bo'sh qoldirib avtomatik yarating:</p>
        <form id="formAddCustomEmail">
          <div class="prefix-input-wrap">
            <input type="text" id="customEmailPrefix" placeholder="masalan: otheracc, test, mrdev" autofocus>
            <span id="domainSuffixLabel">@bombaclat.uz</span>
          </div>
          <div class="modal-btns">
            <button type="button" id="btnAddEmailCancel" class="btn-modal-cancel">Bekor qilish</button>
            <button type="submit" id="btnAddEmailConfirm" class="btn-modal-submit">Yaratish</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MESSAGE DETAIL MODAL -->
    <div id="msgDetailModal" class="modal-layer hidden">
      <div class="modal-backdrop-click" id="msgDetailBackdrop"></div>
      <div class="modal-card modal-large">
        <div class="msg-detail-head">
          <div class="msg-detail-meta">
            <h2 id="msgDetailSubject">Subject</h2>
            <div class="msg-detail-from">
              <span id="msgDetailFrom">From: ...</span>
              <span id="msgDetailTo">To: ...</span>
              <span id="msgDetailDate">Date: ...</span>
            </div>
          </div>
          <button id="btnCloseMsgDetail" class="btn-modal-close">&times;</button>
        </div>
        <div class="msg-detail-body" id="msgDetailBody"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast-popup hidden">
      <span id="toastMsg">copied</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
