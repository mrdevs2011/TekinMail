<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tekinmail // instant aliases</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        <span class="brand-name">tekinmail</span>
        <span class="badge">@tekinmail.abrdns.com</span>
      </div>

      <div class="header-right">
        <button id="themeToggle" class="btn-icon" title="Toggle theme">
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 1. LOGIN CARD (2-BOSQICHLI) -->
    <main id="loginCard" class="card">
      <div class="login-header">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <h2 id="loginTitle">admin authentication</h2>
        <p id="loginSubtitle">kirish uchun 1-parolni kiriting</p>
      </div>

      <!-- Step 1: Pass 1 -->
      <form id="formPass1" class="login-form">
        <input type="password" id="inputPass1" placeholder="enter password 1..." autocomplete="current-password" required autofocus>
        <button type="submit" class="btn btn-action full-width">continue</button>
      </form>

      <!-- Step 2: Pass 2 (Yashirin turadi) -->
      <form id="formPass2" class="login-form hidden">
        <input type="password" id="inputPass2" placeholder="enter password 2 (security key)..." autocomplete="current-password" required>
        <button type="submit" class="btn btn-action full-width">verify & access</button>
      </form>
    </main>

    <!-- 2. ASOSIY BOSHQARUV KARTASI (LOGIN BO'LGACH OCHILADI) -->
    <main id="appCard" class="card hidden">
      <div class="action-bar">
        <div class="meta">
          <h2>aliases</h2>
          <span class="count-pill" id="emailsCount">0</span>
        </div>

        <button id="btnAddFive" class="btn btn-action">
          <svg id="btnIconPlus" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5v14"/>
          </svg>
          <svg id="btnIconLock" class="hidden" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="btnText">add 5</span>
        </button>
      </div>

      <!-- Cooldown Warning -->
      <div id="cooldownBanner" class="cooldown-box hidden">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>cooldown active: <strong id="cooldownTimerDisplay">05:00</strong></span>
      </div>

      <!-- Search -->
      <div class="search-box">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="emailSearch" placeholder="filter aliases..." autocomplete="off" spellcheck="false">
      </div>

      <!-- Emails List -->
      <div class="list" id="emailsList">
        <div class="empty">
          <p>no aliases yet</p>
          <span>click <code>add 5</code> to allocate</span>
        </div>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <span id="toastText">copied</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
